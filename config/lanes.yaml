# Where posts come from. Three kinds of lanes:
#   intent: buyer     -> SMB owners/operators posting about pain you solve (these are leads)
#   intent: audience  -> creators your buyers follow (visibility in front of buyers)
#   intent: prospect  -> specific people you want as clients (warm them up before DMing)
#
# These defaults are a starting hypothesis built from your Notion strategy. Run
#   python -m engine yield-test
# once you have an Apify token. It measures what share of each lane's authors are real buyers,
# and you should keep or kill lanes based on that, not on gut feel.
#
# LinkedIn search syntax works in queries: quotes for phrases, OR between terms.

vendor_headline_patterns:
  # Authors whose headline matches these are other builders/sellers, not buyers.
  # Applied to buyer lanes only (you still want to comment on big creators in audience lanes).
  - "ai automation"
  - "automation agency"
  - "automation specialist"
  - "automation expert"
  - "ai agency"
  - "ai agent"
  - "ai employees"
  - "n8n"
  - "make.com"
  - "zapier"
  - "gohighlevel"
  - "ghl"
  - "voice ai"
  - "chatbot"
  - "lead gen"
  - "lead generation"
  - "growth hacker"
  - "prompt engineer"
  - "no-code"
  - "saas founder"
  - "crm consultant"

lanes:
  # Decision makers in the UAE, KSA and UK. Search for clinic owners/directors, not vendors
  # pitching receptionist software. budget_weight affects scrape allocation only, never quality scores.
  - id: clinics
    name: Clinic & dental owners (UAE, KSA, UK)
    kind: search
    intent: buyer
    enabled: true
    weight: 1.0
    budget_weight: 1.4
    posted_limit: week   # owners post rarely; the watermark still only fetches what's new
    max_age_hours: 120   # a buyer reads every comment on their post, even days later
    max_posts_per_query: 25
    sort_by: date
    queries:
      - Dubai clinic owner
      - Dubai dental clinic
      - Dubai aesthetic clinic
      - UAE clinic owner
      - UAE dental practice
      - Saudi clinic owner
      - Riyadh clinic
      - Jeddah clinic
      - Abu Dhabi clinic
      - London clinic owner
      - UK dental clinic
    buyer_headline_hints: [clinic, dental, dentist, "med spa", aesthetic, dermatolog, physio, "medical director", "practice owner", "clinic manager", "medical center", polyclinic, physician]

  - id: realestate
    name: Dubai & GCC real estate brokerage decision makers
    kind: search
    intent: buyer
    enabled: true
    weight: 1.0
    budget_weight: 1.75
    posted_limit: week   # owners post rarely; the watermark still only fetches what's new
    max_age_hours: 120   # a buyer reads every comment on their post, even days later
    max_posts_per_query: 25
    sort_by: date
    queries:
      - Dubai real estate
      - Dubai real estate brokerage
      - Dubai off-plan sales
      - Dubai property leads
      - Dubai real estate agents
      - UAE real estate broker
      - Dubai property market
      - Abu Dhabi real estate
      - Riyadh real estate
      - Saudi real estate market
    buyer_headline_hints: [broker, brokerage, "real estate", realtor, property, "sales director", "head of sales", "managing director", ceo, founder]

  - id: gcc_audience
    name: Popular GCC business posts (your buyers' feed)
    kind: search
    intent: audience
    enabled: true
    weight: 0.85
    budget_weight: 0.3
    posted_limit: 24h
    max_age_hours: 48    # popular posts move fast: comment early
    min_likes: 30        # only posts with real reach
    max_posts_per_query: 25
    sort_by: date
    queries:
      - Dubai real estate market
      - Saudi business growth
      - Dubai business owners
      - UAE healthcare
      - Riyadh entrepreneurs
      - customer experience Saudi
      - Dubai entrepreneurs
      - Saudi SMEs
      - UAE startups growth
      - Vision 2030 business
    buyer_headline_hints: [founder, ceo, owner, "managing director", clinic, brokerage, "general manager"]

  - id: smb_owners
    name: GCC SMB founders & GMs (service businesses)
    kind: search
    intent: buyer
    enabled: true
    weight: 0.9
    budget_weight: 0.55
    posted_limit: week
    max_age_hours: 120
    max_posts_per_query: 25
    sort_by: date
    author_keywords: '"business owner" OR founder OR "co-founder" OR CEO OR "managing director" OR "general manager"'
    queries:
      - Dubai customers WhatsApp
      - Riyadh small business
      - UAE SME growth
      - Saudi customer service
      - Dubai service business
      - Riyadh restaurant owner
    buyer_headline_hints: [owner, founder, ceo, "managing director", "general manager", restaurant, salon, clinic, rental, "car rental", spa]

  - id: agencies
    name: Marketing-agency owners (white-label partners)
    kind: search
    intent: buyer
    enabled: false   # live test 2026-10-05: almost no results with an owner-title filter
    weight: 0.9
    posted_limit: 24h
    max_posts_per_query: 25
    budget_weight: 0.5
    sort_by: date
    author_keywords: '"marketing agency" OR "digital agency" OR "performance marketing" OR "media buying"'
    queries:
      - clinic marketing leads
      - healthcare marketing agency
    buyer_headline_hints: [agency, "marketing director", "performance marketing", "media buyer"]

  - id: ops
    name: Ops leaders drowning in calls, WhatsApp & Excel
    kind: search
    intent: buyer
    enabled: false   # pain-word search was mostly vendors; needs an author-title filter before enabling
    weight: 0.8
    posted_limit: 24h
    max_posts_per_query: 25
    budget_weight: 0.5
    sort_by: date
    queries:
      - dispatch drivers calls WhatsApp operations
      - manual invoice matching purchase orders
    buyer_headline_hints: [operations, logistics, "supply chain", "coo", "general manager", procurement, fleet, warehouse]

  - id: creators
    name: Creators your buyers follow
    kind: profiles
    intent: audience
    enabled: false   # add real URLs first, then enable
    weight: 0.8
    posted_limit: 24h
    max_posts_per_profile: 2
    # Paste LinkedIn profile URLs. Pick people CLINIC / BROKER / SMB OWNERS follow,
    # not AI-automation influencers (their audience is your competitors).
    # `python -m engine suggest-creators` lists high-engagement authors the engine keeps seeing.
    profiles: []

  - id: prospects
    name: Dream prospects
    kind: profiles
    intent: prospect
    enabled: false   # add real URLs first, then enable
    weight: 1.3
    posted_limit: week
    max_posts_per_profile: 1
    # 30-100 specific owners you'd love as clients. Every post they make jumps your queue.
    profiles: []

  - id: competitor_reach
    name: AI lead response vendors with buyer audiences
    kind: search
    intent: audience
    enabled: true
    weight: 0.72
    budget_weight: 0.8
    posted_limit: 24h
    max_age_hours: 36
    min_likes: 5
    max_posts_per_query: 25
    sort_by: date
    queries:
      - AI receptionist clinic
      - AI receptionist real estate
      - Dubai real estate WhatsApp automation
      - clinic WhatsApp automation
      - real estate AI lead follow-up
      - dental technology UAE
      - voice AI property
      - Dubai proptech
    buyer_headline_hints: [founder, ceo, owner, broker, brokerage, clinic, dental, "real estate", "head of sales"]
