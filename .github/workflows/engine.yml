# Runs the engine on a schedule so it works while your laptop is off.
# The state database (data/engine.db) lives in this PRIVATE repo and is committed back after every run,
# so there is exactly one copy of your cards and your Telegram taps always land on the right one.
# Don't run the engine locally while this schedule is on: two copies of the database would drift apart.
# The dashboard never touches the database: it appends your clicks to state/actions.jsonl, which each run applies,
# and reads state/dashboard.json, which each run rewrites.
name: comment-engine

on:
  schedule:
    # 08:00, 13:00, 18:00 Riyadh time (UTC+3). GitHub may start these a few minutes late.
    - cron: "0 5,10,15 * * *"
  workflow_dispatch: {}

concurrency:
  group: comment-engine
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run engine
        run: python -m engine run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save state
        if: always()
        run: |
          git config user.name "comment-engine"
          git config user.email "comment-engine@users.noreply.github.com"
          git add -f data/engine.db state/dashboard.json
          if git diff --cached --quiet; then echo "no state change"; exit 0; fi
          git commit -m "state: run ${{ github.run_id }}"
          git pull --rebase
          git push
