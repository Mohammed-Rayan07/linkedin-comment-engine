# Runs the engine on a schedule so it works while your laptop is off.
# Use a PRIVATE repo: the state database holds names of people whose posts were scraped.
# State persists between runs via the Actions cache (not committed to git).
name: comment-engine

on:
  schedule:
    # 08:00, 13:00, 18:00 Riyadh time (UTC+3). GitHub may start these a few minutes late.
    - cron: "0 5,10,15 * * *"
  workflow_dispatch: {}

concurrency:
  group: comment-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: data
          key: engine-db-${{ github.run_id }}
          restore-keys: engine-db-

      - name: Run engine
        run: python -m engine run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: engine-db-${{ github.run_id }}
