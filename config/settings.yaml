# Global knobs. Lanes (where posts come from) live in lanes.yaml.

timezone: Asia/Riyadh

models:
  # gemini = free tier (default). claude = paid API, if you add ANTHROPIC_API_KEY later.
  provider: gemini
  gemini:
    scoring: gemini-3.5-flash-lite   # triage is simple; Lite is fast and rarely overloaded
    scoring_thinking: low        # minimal | low | medium | high
    drafting: gemini-3.8-flash   # best model on the free tier (Pro models are paid-only)
    drafting_thinking: high
    # tried in order when the main model is overloaded (503) or out of free quota
    fallbacks: [gemini-3.7-flash, gemini-3.6-flash, gemini-3.5-flash, gemini-3.5-flash-lite]
    min_seconds_between_calls: 7 # stays under free-tier requests-per-minute limits
  claude:
    scoring: claude-opus-5-5
    scoring_effort: low
    drafting: claude-opus-5-5
    drafting_effort: high
    server_fallbacks: true

budgets:
  # Apify bills ~$0.002 per returned post (+$0.001 per query that returns nothing).
  # 80/day = $0.16/day ≈ $4.80/month, inside the free plan's $5 monthly credit.
  # Roughly a third survive the filters + scoring, which is what 20-25 cards/day needs.
  max_posts_scraped_per_day: 80
  # Split across the enabled lanes each run (3 scheduled runs/day ≈ 80 posts).
  max_posts_per_run: 27
  # How many filtered posts get an LLM score per run.
  max_llm_scored_per_run: 40
  # Cards you receive in Telegram. 15-20/day is a solid, sustainable commenting habit.
  max_cards_per_day: 25
  max_cards_per_run: 10
  # Minimum final priority (0-10) for a post to become a card.
  min_priority: 6.0
  # If strong posts can't fill the quota, posts down to this score fill the gap (the card shows the score).
  floor_priority: 5.0

filters:
  min_post_chars: 180
  max_age_hours: 36          # early comments get the reach; older posts are skipped
  max_comments: 150          # past this, your comment is buried
  skip_non_english: true     # you review every comment before posting, so drafts stay in a language you can check

comment:
  min_chars: 140
  max_chars: 650
  options_per_post: 3

telegram:
  enabled: true

# Your own LinkedIn numbers on the dashboard: likes + replies on the comments you post, and followers.
# Read from your PUBLIC activity via Apify (no login). Also auto-marks a card "posted" when your comment
# shows up on its post. Costs ~$0.002 per comment read, taken from the same daily Apify cap as post
# scraping (so the month never goes over $5; it just means a few fewer posts scanned that day).
my_stats:
  enabled: false
  profile_url: https://www.linkedin.com/in/mohammed-rayan-ai/
  every_days: 2          # how often to check
  max_comments: 30       # newest comments read per check (~$0.06 + $0.004 for followers)
